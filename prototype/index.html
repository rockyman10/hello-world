<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARFALL: Eclipse Protocol — Prototype</title>
<style>
  :root {
    --bg: #0a0e1a; --panel: #121829; --panel2: #1a2138; --line: #2a3352;
    --text: #dce4ff; --dim: #7a86ad; --accent: #5ee0ff; --gold: #ffd75e; --purple: #c084fc;
    --hp: #4ade80; --hp-low: #f87171; --meter: #5ee0ff; --shield: #93c5fd;
    --buff: #4ade80; --debuff: #f472b6; --ion: #7dd3fc; --cryo: #a5b4fc; --plasma: #fda4af; --umbral: #c084fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% -20%, #1a2450 0%, var(--bg) 60%);
    color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; padding: 12px; display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 16px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin: 4px 0 8px; text-align: center; }
  h1 small { color: var(--dim); letter-spacing: 1px; font-size: 10px; display: block; }
  .wrap { width: 100%; max-width: 940px; }
  #currencies { display: flex; gap: 14px; justify-content: center; font-size: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  #currencies span b { color: var(--gold); }
  #tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  #tabs button {
    background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 8px 8px 0 0;
    padding: 8px 18px; font-size: 12px; letter-spacing: 2px; cursor: pointer; text-transform: uppercase;
  }
  #tabs button.on { color: var(--accent); border-color: var(--accent); background: var(--panel2); }
  .screen { display: none; } .screen.on { display: block; }

  /* cards shared */
  .row { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; width: 158px; position: relative; transition: box-shadow .15s, transform .15s;
  }
  .card.active { box-shadow: 0 0 14px var(--accent); border-color: var(--accent); transform: translateY(-2px); }
  .card.targetable { cursor: pointer; border-color: var(--gold); }
  .card.targetable:hover { box-shadow: 0 0 12px var(--gold); }
  .card.dead { opacity: .32; filter: grayscale(1); }
  .cname { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tagline { font-size: 9px; color: var(--dim); margin-bottom: 5px; }
  .aff { display: inline-block; padding: 0 5px; border-radius: 6px; font-size: 8px; text-transform: uppercase; letter-spacing: 1px; color: #0a0e1a; font-weight: 700; }
  .aff.ion { background: var(--ion); } .aff.cryo { background: var(--cryo); }
  .aff.plasma { background: var(--plasma); } .aff.umbral { background: var(--umbral); }
  .bar { height: 7px; background: #0d1122; border-radius: 4px; overflow: hidden; margin-bottom: 3px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; transition: width .25s; }
  .hpfill { background: var(--hp); } .hpfill.low { background: var(--hp-low); }
  .shieldfill { background: var(--shield); }
  .meterfill { background: var(--meter); opacity: .8; }
  .nums { font-size: 9px; color: var(--dim); display: flex; justify-content: space-between; }
  .fx { min-height: 14px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px; }
  .chip { font-size: 8px; padding: 0 4px; border-radius: 4px; border: 1px solid; }
  .chip.buff { color: var(--buff); border-color: var(--buff); }
  .chip.debuff { color: var(--debuff); border-color: var(--debuff); }

  /* missions */
  .mission {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .mission .info { flex: 1; min-width: 240px; }
  .mission h3 { font-size: 14px; } .mission h3 em { font-size: 10px; color: var(--dim); font-style: normal; margin-left: 6px; }
  .mission p { font-size: 11px; color: var(--dim); margin: 3px 0; }
  .reward { font-size: 11px; color: var(--gold); }
  .reward.cleared { color: var(--dim); }
  .launch { background: var(--accent); border: 0; color: #06101c; font-weight: 700; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .launch:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }

  /* hangar */
  .unit {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; width: 220px; display: flex; flex-direction: column; gap: 5px;
  }
  .unit.r5 { border-color: var(--gold); } .unit.r4 { border-color: var(--purple); }
  .stars { font-size: 10px; } .r5 .stars { color: var(--gold); } .r4 .stars { color: var(--purple); }
  .statline { font-size: 10px; color: var(--dim); }
  .unit select { background: #0d1122; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 10px; padding: 3px; }
  .sqbtn { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 4px; font-size: 10px; cursor: pointer; }
  .sqbtn.in { color: var(--accent); border-color: var(--accent); }
  .shop { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .shop h3 { font-size: 12px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; text-align: center; }
  .shopbtn { background: none; border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 4px 8px; font-size: 10px; cursor: pointer; }
  .shopbtn:disabled { border-color: var(--line); color: var(--dim); cursor: not-allowed; }

  /* gacha */
  #banner-panel { background: var(--panel2); border: 1px solid var(--gold); border-radius: 12px; padding: 18px; text-align: center; }
  #banner-panel h2 { color: var(--gold); letter-spacing: 3px; font-size: 18px; text-transform: uppercase; }
  #banner-panel .sub { color: var(--dim); font-size: 11px; margin: 6px 0 12px; }
  .pity { font-size: 11px; margin: 4px 0; color: var(--text); }
  .pity b { color: var(--gold); }
  .pullbtns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .pullbtns button { background: var(--gold); border: 0; color: #1a1405; font-weight: 700; padding: 12px 22px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .pullbtns button.dev { background: none; border: 1px dashed var(--line); color: var(--dim); font-weight: 400; font-size: 10px; }
  .pullbtns button:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
  .rates { font-size: 9px; color: var(--dim); margin-top: 10px; }

  /* battle hud */
  #hud { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #skills { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .skillbtn { background: #101731; color: var(--text); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer; min-width: 130px; text-align: left; }
  .skillbtn:hover:not(:disabled) { background: #1b2547; }
  .skillbtn:disabled { border-color: var(--line); color: var(--dim); cursor: not-allowed; }
  .skillbtn small { display: block; font-size: 9px; color: var(--dim); }
  .ctl { display: flex; gap: 6px; }
  .ctl button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 8px 10px; font-size: 11px; cursor: pointer; }
  .ctl button.on { color: var(--accent); border-color: var(--accent); }
  #hint { font-size: 11px; color: var(--gold); min-height: 18px; margin: 6px 0; }
  #logbox { height: 140px; overflow-y: auto; background: #0d1122; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 11px; line-height: 1.5; font-family: ui-monospace, monospace; margin-top: 8px; }
  #logbox .skill { color: var(--accent); } #logbox .crit { color: var(--gold); }
  #logbox .heal { color: var(--hp); } #logbox .kill { color: var(--hp-low); font-weight: 700; }
  #logbox .buff { color: var(--buff); } #logbox .debuff { color: var(--debuff); }
  #logbox .resist { color: var(--dim); font-style: italic; }

  /* modals */
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5,8,18,.88); z-index: 10; flex-direction: column; gap: 14px; padding: 20px; }
  .modal h2 { font-size: 30px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); text-align: center; }
  .modal .sub2 { color: var(--text); font-size: 13px; text-align: center; }
  .modal button.close { background: var(--accent); border: 0; color: #06101c; font-weight: 700; padding: 10px 26px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  #reveal-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 760px; }
  .pull-card { width: 130px; border-radius: 10px; padding: 10px; text-align: center; border: 2px solid var(--line); background: var(--panel); animation: pop .35s ease; }
  .pull-card.r5 { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,215,94,.45); }
  .pull-card.r4 { border-color: var(--purple); box-shadow: 0 0 12px rgba(192,132,252,.35); }
  .pull-card .pr { font-size: 11px; }
  .pull-card.r5 .pr { color: var(--gold); } .pull-card.r4 .pr { color: var(--purple); } .pull-card.r3 .pr { color: var(--dim); }
  .pull-card .pn { font-size: 12px; font-weight: 600; margin: 4px 0; }
  .pull-card .new { color: var(--hp); font-size: 10px; font-weight: 700; }
  .pull-card .dupe { color: var(--dim); font-size: 10px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* story */
  #storyBox {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 26px; max-width: 620px; width: 90%; cursor: pointer; min-height: 140px;
  }
  #storySpeaker { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
  #storyText { font-size: 14px; line-height: 1.6; }
  #storyNext { font-size: 10px; color: var(--dim); margin-top: 14px; text-align: right; }
  #storySkip { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 6px 16px; font-size: 11px; cursor: pointer; }

  /* lore in hangar */
  .fac { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: 8px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; font-weight: 700; }
  .epithet { font-size: 9px; color: var(--dim); font-style: italic; }
  .unit details { font-size: 10px; color: var(--dim); }
  .unit details summary { cursor: pointer; color: var(--accent); font-size: 9px; letter-spacing: 1px; }
  .unit details p { margin-top: 4px; line-height: 1.5; }
  .tiername { font-size: 8px; letter-spacing: 2px; font-weight: 700; }
  .r5 .tiername, .pull-card.r5 .tiername { color: var(--gold); }
  .r4 .tiername, .pull-card.r4 .tiername { color: var(--purple); }
  .pull-card.r3 .tiername { color: var(--dim); }
  .kinship { font-size: 9px; color: var(--hp); }

  /* reactor + rift + leveling */
  #reactorStrip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 11px;
  }
  #reactorStrip b { color: var(--gold); }
  #reactorStrip button { background: var(--gold); border: 0; color: #1a1405; font-weight: 700; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 11px; }
  #reactorStrip button:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
  .lvlrow { display: flex; gap: 6px; align-items: center; }
  .lvlrow .lvl { font-size: 10px; color: var(--gold); font-weight: 700; }
  .lvlbtn { background: none; border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 2px 8px; font-size: 9px; cursor: pointer; }
  .lvlbtn:disabled { border-color: var(--line); color: var(--dim); cursor: not-allowed; }
  .bless {
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
    padding: 14px; width: 180px; cursor: pointer; text-align: center;
  }
  .bless:hover { box-shadow: 0 0 12px var(--accent); }
  .bless h4 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .bless p { font-size: 10px; color: var(--dim); }
  .depthcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 11px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .depthcard .dr { color: var(--gold); }

  /* titans */
  .titancard {
    background: linear-gradient(135deg, #1a1030 0%, var(--panel) 55%);
    border: 1px solid var(--debuff); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
  }
  .titancard h3 { font-size: 20px; letter-spacing: 4px; color: var(--debuff); }
  .titancard .tt { font-size: 11px; color: var(--gold); font-style: italic; margin: 2px 0 8px; }
  .titancard p { font-size: 11px; color: var(--dim); line-height: 1.55; margin-bottom: 6px; }
  .titancard .mech { font-size: 10px; color: var(--accent); margin-bottom: 8px; }
  .titancard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card.titanunit { width: 100%; max-width: 520px; border-color: var(--debuff); background: linear-gradient(135deg, #1a1030 0%, var(--panel) 60%); }
  .card.titanunit .cname { font-size: 17px; letter-spacing: 3px; color: var(--debuff); }
  .card.titanunit .bar { height: 12px; }
  .card.titanunit .nums { font-size: 11px; }

  /* vaults */
  .vaultcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .vaultcard .info { flex: 1; min-width: 220px; }
  .vaultcard h3 { font-size: 14px; }
  .vaultcard p { font-size: 10px; color: var(--dim); margin-top: 3px; }

  /* ---- RAID-style battle presentation ---- */
  #battle.on #battlefield {
    background:
      radial-gradient(1px 1px at 15% 25%, #fff8, transparent 40%),
      radial-gradient(1px 1px at 70% 15%, #fff6, transparent 40%),
      radial-gradient(1px 1px at 40% 70%, #fff7, transparent 40%),
      radial-gradient(2px 2px at 85% 60%, #fff5, transparent 40%),
      radial-gradient(1px 1px at 25% 85%, #fff6, transparent 40%),
      radial-gradient(1px 1px at 60% 45%, #fff4, transparent 40%),
      radial-gradient(ellipse 80% 50% at 50% 0%, #2a1a5e33, transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, #5e1a4a22, transparent);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px 6px;
    animation: nebulaDrift 30s linear infinite alternate;
  }
  @keyframes nebulaDrift { from { background-position: 0 0; } to { background-position: 30px 12px; } }
  #battlefield.shake { animation: shakeHit .3s; }
  @keyframes shakeHit {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); }
    60% { transform: translate(-4px, -2px); } 80% { transform: translate(3px, 2px); }
  }
  #fxlayer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .dmgnum {
    position: absolute; font-weight: 800; font-family: "Segoe UI", system-ui, sans-serif;
    text-shadow: 0 2px 6px #000c; animation: dmgRise .9s ease-out forwards; white-space: nowrap;
  }
  .dmgnum.norm { color: #ffffff; font-size: 17px; }
  .dmgnum.crit { color: var(--gold); font-size: 26px; animation: critPop .9s ease-out forwards; }
  .dmgnum.weak { color: #9aa4c4; font-size: 13px; }
  .dmgnum.heal { color: var(--hp); font-size: 17px; }
  @keyframes dmgRise { 0% { opacity: 0; transform: translateY(6px) scale(.7); } 15% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-42px) scale(1); } }
  @keyframes critPop { 0% { opacity: 0; transform: translateY(4px) scale(.5) rotate(-6deg); } 18% { opacity: 1; transform: translateY(-4px) scale(1.25) rotate(2deg); } 35% { transform: translateY(-8px) scale(1) rotate(0); } 100% { opacity: 0; transform: translateY(-52px) scale(1); } }
  .hitflash { position: absolute; border-radius: 10px; background: radial-gradient(circle, #ffffff2e 0%, transparent 70%); animation: flashOut .35s ease-out forwards; }
  .hitflash.critf { background: radial-gradient(circle, #ffd75e4d 0%, transparent 70%); }
  @keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }
  .castring { position: absolute; border: 2px solid var(--accent); border-radius: 12px; animation: castPulse .5s ease-out forwards; }
  @keyframes castPulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.12); } }
  .emblem { border-radius: 8px; flex: none; }
  .cardhead { display: flex; align-items: center; gap: 6px; }
  #turnRibbon {
    display: flex; gap: 5px; justify-content: center; align-items: center;
    margin-bottom: 10px; min-height: 30px; flex-wrap: wrap;
  }
  #turnRibbon .rlabel { font-size: 8px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-right: 4px; }
  .ribchip {
    width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; color: #0a0e1a; border: 2px solid transparent;
  }
  .ribchip.first { width: 32px; height: 32px; font-size: 11px; box-shadow: 0 0 10px var(--accent); }
  .ribchip.foe { border-color: var(--hp-low); }
  .ribchip.hero { border-color: var(--hp); }

  /* character showcase (banner splash) */
  #heroStage {
    position: relative; width: 100%; height: 640px; border-radius: 16px; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 60% at 50% 30%, #2a1550 0%, transparent 60%),
      radial-gradient(ellipse 90% 70% at 50% 110%, #4a1a6e33, transparent),
      linear-gradient(180deg, #0a0716 0%, #05030c 100%);
    border: 1px solid #3a2a5e;
  }
  #hero3d { position: absolute; inset: 0; width: 100%; height: 100%; }
  #heroOverlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 22px 26px;
    background:
      linear-gradient(180deg, #05030caa 0%, transparent 22%, transparent 60%, #05030cee 100%),
      radial-gradient(ellipse 60% 80% at 50% 50%, transparent 55%, #05030c88 100%);
  }
  #heroTop { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
  #heroTop .tier5 { font-size: 15px; font-weight: 800; letter-spacing: 3px; color: var(--gold); text-shadow: 0 0 16px #ffd75e88; }
  .affrow { display: flex; gap: 6px; align-items: center; }
  .rolechip, .housechip { font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; }
  .rolechip { background: #2a3352; color: var(--text); }
  .housechip { background: transparent; border: 1px solid var(--purple); color: var(--purple); }
  #heroName { text-align: center; margin-bottom: 4px; }
  #heroName .hn { font-size: 40px; font-weight: 800; letter-spacing: 6px; color: #fff; text-shadow: 0 2px 20px #b060ff, 0 0 6px #000; }
  #heroName .he { font-size: 14px; font-style: italic; color: #e2d2ff; letter-spacing: 1px; margin-top: 2px; text-shadow: 0 1px 6px #000; }
  #heroBottom { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .hbio { max-width: 560px; text-align: center; font-size: 12px; line-height: 1.6; color: #b9c2e0; }
  .hstats { display: flex; gap: 18px; font-size: 12px; color: var(--dim); }
  .hstats b { color: var(--text); font-size: 14px; }
  #heroRecruit {
    pointer-events: auto; background: linear-gradient(180deg, #ffe08a, #ffcf6a); border: 0;
    color: #2a1d00; font-weight: 800; font-size: 15px; letter-spacing: 2px; padding: 12px 40px;
    border-radius: 10px; cursor: pointer; box-shadow: 0 0 28px #ffd75e66; transition: transform .1s, box-shadow .2s;
  }
  #heroRecruit:hover { transform: translateY(-2px); box-shadow: 0 0 40px #ffd75eaa; }
  .hnote { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .heroArrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    background: #0a0e1a99; border: 1px solid #ffffff33; color: #fff; width: 42px; height: 42px;
    border-radius: 50%; font-size: 24px; cursor: pointer; line-height: 1; transition: background .15s, box-shadow .15s;
  }
  .heroArrow:hover { background: #1a2340; box-shadow: 0 0 16px #5ee0ff66; }
  #heroPrev { left: 14px; } #heroNext { right: 14px; }
  #heroDots { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 3; }
  #heroDots .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffffff33; cursor: pointer; transition: background .15s; }
  #heroDots .dot.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  @media (max-width: 640px) { #heroName .hn { font-size: 30px; letter-spacing: 3px; } #heroStage { height: 560px; } }

  /* skill cut-in banner (RAID/HSR ultimate flash) */
  #cutin {
    position: fixed; left: 0; right: 0; top: 38%; z-index: 60; pointer-events: none;
    display: none; overflow: hidden;
  }
  #cutin.show { display: block; animation: cutinBar .95s ease-out forwards; }
  #cutin .band {
    background: linear-gradient(90deg, transparent, #0a0e1acc 12%, #0a0e1acc 88%, transparent);
    border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    padding: 14px 0; display: flex; align-items: center; gap: 16px; justify-content: center;
    box-shadow: 0 0 40px #5ee0ff44;
  }
  #cutin .portrait { animation: cutinPortrait .95s cubic-bezier(.15,.7,.2,1) forwards; }
  #cutin .txt { text-align: left; animation: cutinText .95s ease-out forwards; }
  #cutin .who { font-size: 13px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
  #cutin .skill { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
  @keyframes cutinBar { 0% { opacity: 0; } 10% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes cutinPortrait { 0% { transform: translateX(-120px) scale(.7); opacity: 0; } 22% { transform: translateX(0) scale(1); opacity: 1; } 78% { transform: translateX(0) scale(1); } 100% { transform: translateX(30px) scale(1); opacity: .4; } }
  @keyframes cutinText { 0% { transform: translateX(60px); opacity: 0; } 26% { transform: translateX(0); opacity: 1; } 100% { opacity: 1; } }

  /* pull cinematic */
  #cinema {
    position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center;
    background: #04060e; overflow: hidden; cursor: pointer;
  }
  #cinema.show { display: flex; }
  #cinemaStars { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cinemaCore {
    width: 8px; height: 8px; border-radius: 50%; background: #fff; position: relative;
    box-shadow: 0 0 40px 12px #5ee0ff; animation: warp 1.6s ease-in forwards;
  }
  @keyframes warp {
    0% { transform: scale(.4); box-shadow: 0 0 30px 8px #5ee0ff; }
    55% { transform: scale(1.6); box-shadow: 0 0 80px 30px #7dd3fc; }
    75% { transform: scale(1); box-shadow: 0 0 60px 20px #ffd75e; }
    100% { transform: scale(60); box-shadow: 0 0 200px 120px #fff; }
  }
  #cinema .crackline { position: absolute; background: #fff; opacity: 0; transform-origin: center; }
  #cinemaResult {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  #cinemaResult.show { display: flex; animation: resultFade .5s ease-out; }
  @keyframes resultFade { from { opacity: 0; } to { opacity: 1; } }
  #cinema .rtier { font-size: 16px; letter-spacing: 6px; font-weight: 800; }
  #cinema .rtier.r5 { color: var(--gold); text-shadow: 0 0 24px var(--gold); }
  #cinema .rtier.r4 { color: var(--purple); text-shadow: 0 0 18px var(--purple); }
  #cinema .rname { font-size: 30px; font-weight: 800; letter-spacing: 2px; }
  #cinema .rep { font-size: 13px; color: var(--dim); font-style: italic; }
  #cinema .skip { position: absolute; bottom: 26px; font-size: 12px; color: var(--dim); letter-spacing: 2px; }
  #cinemaBurst { position: absolute; width: 4px; height: 4px; }

  /* 3D arena */
  #arena3d {
    display: none; width: 100%; height: 340px; border-radius: 14px;
    border: 1px solid var(--line); margin-bottom: 10px;
    background: radial-gradient(ellipse at 50% 30%, #10173a 0%, #070a14 70%);
  }
  body.view3d #arena3d { display: block; }
  body.view3d #battlefield .card { opacity: .92; }

  /* frontier */
  .modcard { background: linear-gradient(135deg, #301a10 0%, var(--panel) 60%); border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .modcard h3 { color: var(--gold); font-size: 15px; letter-spacing: 2px; }
  .modcard p { font-size: 11px; color: var(--dim); margin-top: 4px; }
</style>
</head>

<script>
const S = window.Starfall, M = window.StarfallMeta;
const $ = (id) => document.getElementById(id);
const show = (id) => { $(id).style.display = 'flex'; };
const hide = (id) => { $(id).style.display = 'none'; };
const rng = S.makeRng(Date.now() & 0xffffffff);

// ------------------------------------------------------------ profile & save

const SAVE_KEY = 'starfall-proto-v1';
let profile;
try { profile = M.migrateProfile(JSON.parse(localStorage.getItem(SAVE_KEY)) || M.newProfile()); }
catch (e) { profile = M.newProfile(); }
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(profile)); renderCurrencies(); }

// ------------------------------------------------------------ shell

function renderCurrencies() {
  $('currencies').innerHTML =
    `<span>⬡ Voidglass <b>${profile.voidglass}</b></span>` +
    `<span>¢ Credits <b>${profile.credits}</b></span>` +
    `<span>◆ Echo Shards <b>${profile.shards}</b></span>` +
    `<span>▣ Caches <b>${profile.caches}</b></span>` +
    `<span>5★ pity <b>${profile.pity5}</b>/90</span>`;
}

function switchScreen(name) {
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.s === name);
  for (const s of document.querySelectorAll('.screen')) s.classList.remove('on');
  $(name).classList.add('on');
  $('tabs').style.display = name === 'battle' ? 'none' : 'flex';
  if (name === 'showcase') openShowcase(); else Showcase.stop();
  if (name === 'missions') renderMissions();
  if (name === 'rift') renderRift();
  if (name === 'frontier') renderFrontier();
  if (name === 'titans') renderTitans();
  if (name === 'vaults') renderVaults();
  if (name === 'hangar') renderHangar();
  if (name === 'gacha') renderGacha();
}
for (const b of document.querySelectorAll('#tabs button')) b.onclick = () => switchScreen(b.dataset.s);

// ------------------------------------------------------------ missions

function renderMissions() {
  const pending = M.reactorPending(profile, Date.now());
  const reactor = `<div id="reactorStrip">
    <span>☢ <b>Meridian Reactor</b> — your off-duty operatives keep the ship running while you're away.</span>
    <span>Accrued: <b>¢${pending}</b> (rate ¢${M.reactorRate(profile)}/h, caps at 24h)</span>
    <button id="collectBtn" ${pending > 0 ? '' : 'disabled'}>COLLECT</button>
  </div>`;
  $('missions').innerHTML = reactor + M.ENCOUNTERS.map((e) => {
    const cleared = profile.cleared[e.id];
    const r = cleared ? e.repeat : e.firstClear;
    return `<div class="mission">
      <div class="info">
        <h3>${e.name}<em>${e.tier}</em></h3>
        <p>${e.desc}</p>
        <div class="reward ${cleared ? 'cleared' : ''}">${cleared ? 'repeat: ' : 'FIRST CLEAR JACKPOT: '}⬡${r.voidglass}${r.caches ? ` + ▣${r.caches}` : ''}</div>
      </div>
      <button class="launch" data-e="${e.id}" ${profile.squad.length ? '' : 'disabled'}>LAUNCH ▸</button>
    </div>`;
  }).join('') + `<p style="font-size:10px;color:var(--dim);text-align:center">Design pillar on display: first clears pay jackpots, repeats pay little — new challenges are where the rewards are.</p>`;
  for (const b of document.querySelectorAll('.launch')) b.onclick = () => startBattle(b.dataset.e);
  $('collectBtn').onclick = () => {
    const got = M.collectReactor(profile, Date.now());
    save(); renderMissions();
    $('hint') && ($('hint').textContent = '');
    if (got > 0) $('reactorStrip').firstElementChild.innerHTML = `☢ <b>Collected ¢${got}!</b> Reactor cycling...`;
  };
}

// ------------------------------------------------------------ titan hunts & house vaults

let currentMode = null; // { type: 'titan'|'vault', id, returnTab }

function renderTitans() {
  $('titans').innerHTML =
    `<p style="font-size:11px;color:var(--dim);text-align:center;margin-bottom:10px">When the Eclipse breached Vault Zero of the Genome Archive, it found humanity's myths — and grew them at starship scale. <b style="color:var(--debuff)">Archive Titans</b> are raid-tier hunts: huge first-slay jackpots, small repeat bounties.</p>` +
    M.TITANS.map((t) => {
      const slain = profile.cleared['titan:' + t.id];
      const r = slain ? t.repeat : t.firstClear;
      return `<div class="titancard">
        <h3>${t.name}</h3>
        <div class="tt">${t.title}${slain ? ' — SLAIN (echo hunt available)' : ''}</div>
        <p>${t.desc}</p>
        <div class="mech">⚠ ${t.mech}</div>
        <div class="foot">
          <span class="reward ${slain ? 'cleared' : ''}">${slain ? 'echo bounty: ' : 'FIRST SLAY: '}⬡${r.voidglass}${r.caches ? ` + ▣${r.caches}` : ''} + ¢${r.credits}</span>
          <button class="launch" data-t="${t.id}" ${profile.squad.length ? '' : 'disabled'}>HUNT ▸</button>
        </div>
      </div>`;
    }).join('');
  for (const b of $('titans').querySelectorAll('[data-t]')) b.onclick = () => startTitan(b.dataset.t);
}

function startTitan(id) {
  const t = M.titanById(id);
  currentMode = { type: 'titan', id, returnTab: 'titans' };
  bstate = S.newBattle(undefined, M.squadDefs(profile), t.foes);
  bstate.log.push({ text: `ARCHIVE TITAN ENGAGED: ${t.name}, ${t.title}`, cls: 'kill', turn: 0 });
  currentActor = null; pendingSkill = null;
  switchScreen('battle');
  render();
  loop();
}

function renderVaults() {
  const houses = Object.entries(M.FACTIONS).filter(([k]) => k !== 'eclipsed');
  $('vaults').innerHTML =
    `<p style="font-size:11px;color:var(--dim);text-align:center;margin-bottom:10px">Each House keeps a sealed vault deck — and only that House's operatives may answer when the Eclipsed breach it. Collection depth is power here. <span style="color:var(--gold)">First clear: ▣${M.VAULT_REWARD_FIRST.caches} + ◆${M.VAULT_REWARD_FIRST.shards} + ¢${M.VAULT_REWARD_FIRST.credits}</span></p>` +
    houses.map(([k, f]) => {
      const roster = M.vaultRoster(profile, k);
      const cleared = profile.cleared['vault:' + k];
      return `<div class="vaultcard">
        <div class="info">
          <h3 style="color:${f.color}">${f.label} Vault${cleared ? ' <span style="font-size:9px;color:var(--dim)">CLEARED</span>' : ''}</h3>
          <p>Your ${f.label} operatives: ${roster.length ? roster.join(', ') : 'none — recruit some first'}</p>
        </div>
        <button class="launch" data-v="${k}" ${roster.length ? '' : 'disabled'}>DEFEND ▸</button>
      </div>`;
    }).join('');
  for (const b of $('vaults').querySelectorAll('[data-v]')) b.onclick = () => startVault(b.dataset.v);
}

function startVault(factionKey) {
  currentMode = { type: 'vault', id: factionKey, returnTab: 'vaults' };
  bstate = S.newBattle(undefined, M.vaultSquadDefs(profile, factionKey), M.vaultFoes());
  const f = M.FACTIONS[factionKey];
  bstate.log.push({ text: `${f.label} answers the vault alarm — no other House may enter.`, cls: 'skill', turn: 0 });
  if (M.vaultRoster(profile, factionKey).length >= M.KINSHIP.minCount) {
    bstate.log.push({ text: `Kinship Protocol: full-House deployment (+12% ATK/DEF)`, cls: 'buff', turn: 0 });
  }
  currentActor = null; pendingSkill = null;
  switchScreen('battle');
  render();
  loop();
}

// ------------------------------------------------------------ eclipse frontier

let frontier = null; // { stage, hpFrac }

function renderFrontier() {
  const mod = M.frontierModifier();
  const seasonDone = profile.cleared[M.FRONTIER.seasonKey];
  const stages = M.FRONTIER.stages.map((st, i) => `<div class="depthcard">
    <span><b>${st.name}</b> <span style="color:var(--dim)">(enemy power ×${st.mult})</span></span>
    <span class="dr">⬡${st.reward.voidglass} + ¢${st.reward.credits}${st.reward.caches ? ` + ▣${st.reward.caches}` : ''}</span>
  </div>`).join('');
  $('frontier').innerHTML = `
    <div class="modcard">
      <h3>ECLIPSE FRONTIER — ${M.FRONTIER.season}</h3>
      <p>This week's protocol: <b style="color:var(--gold)">${mod.label}</b> — ${mod.desc}. The modifier applies to <b>both sides</b>. Three lines, no healing between, wounds persist.</p>
      <p>${seasonDone ? 'Seasonal jackpot claimed — lines still pay per stage.' : `Seasonal full-clear jackpot: <b style="color:var(--gold)">⬡${M.FRONTIER.clearBonus.voidglass} + ▣${M.FRONTIER.clearBonus.caches}</b> (one-time)`}</p>
    </div>
    ${stages}
    <div style="text-align:center;margin-top:12px">
      <button class="launch" id="frontierEnter" ${profile.squad.length ? '' : 'disabled'}>HOLD THE LINE ▸</button>
    </div>`;
  $('frontierEnter').onclick = () => {
    frontier = { stage: 0, hpFrac: {} };
    startFrontierBattle();
  };
}

function startFrontierBattle() {
  const mod = M.frontierModifier();
  const heroes = M.applyModifier(M.squadDefs(profile), mod);
  bstate = S.newBattle(undefined, heroes, M.frontierStageFoes(frontier.stage));
  for (const u of bstate.units) {
    if (u.side === 'hero' && frontier.hpFrac[u.name] != null) {
      u.hp = Math.max(1, Math.round(u.maxHp * frontier.hpFrac[u.name]));
    }
  }
  bstate.log.push({ text: `— ${M.FRONTIER.stages[frontier.stage].name} · protocol: ${mod.label} —`, cls: 'skill', turn: 0 });
  currentActor = null; pendingSkill = null;
  switchScreen('battle');
  render();
  loop();
}

// ------------------------------------------------------------ void rift

let rift = null; // { depth, hpFrac: {name: frac}, blessings: [ids] }

function renderRift() {
  const depths = M.RIFT.depths.map((d, i) => `<div class="depthcard">
    <span><b>Depth ${i + 1}:</b> ${d.name} <span style="color:var(--dim)">(enemy power ×${d.mult})</span></span>
    <span class="dr">⬡${d.reward.voidglass} + ¢${d.reward.credits}${d.reward.caches ? ` + ▣${d.reward.caches}` : ''}</span>
  </div>`).join('');
  $('rift').innerHTML = `
    <p style="font-size:11px;color:var(--dim);text-align:center;margin-bottom:10px">
      A fracture in causality. Three depths, one squad, no healing between fights — but each depth cleared offers a <b style="color:var(--accent)">Blessing</b> for the rest of the run.
      Wounds persist. Retreating keeps everything already earned.
    </p>
    ${depths}
    <div style="text-align:center;margin-top:12px">
      <button class="launch" id="riftEnter" ${profile.squad.length ? '' : 'disabled'}>ENTER THE RIFT ▸</button>
    </div>
    <p style="font-size:10px;color:var(--dim);text-align:center;margin-top:8px">(In the full game this is the weekly premium-currency well — infinitely replayable because the blessings reroll, not because you're forced to.)</p>`;
  $('riftEnter').onclick = () => {
    rift = { depth: 0, hpFrac: {}, blessings: [] };
    startRiftBattle();
  };
}

function startRiftBattle() {
  currentEnc = null;
  let defs = M.applyBlessings(M.squadDefs(profile), rift.blessings);
  bstate = S.newBattle(undefined, defs, M.riftFoes(rift.depth));
  // Wounds persist between depths.
  for (const u of bstate.units) {
    if (u.side === 'hero' && rift.hpFrac[u.name] != null) {
      u.hp = Math.max(1, Math.round(u.maxHp * rift.hpFrac[u.name]));
    }
  }
  bstate.log.push({ text: `— Depth ${rift.depth + 1}: ${M.RIFT.depths[rift.depth].name} —`, cls: 'skill', turn: 0 });
  for (const id of rift.blessings) {
    const bl = M.RIFT.blessings.find((x) => x.id === id);
    if (bl) bstate.log.push({ text: `Blessing active: ${bl.label}`, cls: 'buff', turn: 0 });
  }
  currentActor = null; pendingSkill = null;
  switchScreen('battle');
  render();
  loop();
}

function offerBlessings() {
  const picks = M.pickBlessings(rng, 3);
  $('blessChoices').innerHTML = picks.map((b) => `<div class="bless" data-b="${b.id}">
    <h4>${b.label}</h4><p>${b.desc}</p>
  </div>`).join('');
  for (const el of $('blessChoices').querySelectorAll('.bless')) {
    el.onclick = () => {
      const b = M.RIFT.blessings.find((x) => x.id === el.dataset.b);
      if (b.heal) {
        for (const n of Object.keys(rift.hpFrac)) rift.hpFrac[n] = Math.min(1, rift.hpFrac[n] + b.heal);
      } else {
        rift.blessings.push(b.id);
      }
      hide('blessModal');
      rift.depth++;
      startRiftBattle();
    };
  }
  show('blessModal');
}

// ------------------------------------------------------------ hangar

function renderHangar() {
  const names = Object.keys(profile.owned).sort((a, b) => M.UNITS[b].rarity - M.UNITS[a].rarity);
  const bonded = M.kinshipFactions(profile.squad.filter((n) => profile.owned[n]).slice(0, 5));
  const cards = names.map((n) => {
    const u = M.UNITS[n], o = profile.owned[n];
    const d = M.withGear(M.withLevel(u.def, o.level), o.gear);
    const inSquad = profile.squad.includes(n);
    const lvl = o.level || 1;
    const lvlCost = M.levelUpCost(lvl);
    const lvlRow = lvl >= M.LEVEL_CAP
      ? `<div class="lvlrow"><span class="lvl">Lv ${lvl}</span><span style="font-size:9px;color:var(--dim)">MAX</span></div>`
      : `<div class="lvlrow"><span class="lvl">Lv ${lvl}</span><button class="lvlbtn" data-lvl="${n}" ${profile.credits >= lvlCost ? '' : 'disabled'}>LEVEL UP — ¢${lvlCost}</button></div>`;
    const lore = M.LORE[n] || {};
    const fac = M.FACTIONS[lore.faction];
    const hasKinship = inSquad && bonded.includes(lore.faction);
    const opts = ['<option value="">— no gear —</option>'].concat(Object.entries(M.GEAR_SETS)
      .filter(([k, g]) => !g.titan || M.gearUnlocked(profile, k))
      .map(([k, g]) => `<option value="${k}" ${o.gear === k ? 'selected' : ''}>${g.titan ? '☠ ' : ''}${g.label} · ${g.desc}</option>`)).join('');
    return `<div class="unit r${u.rarity}">
      <div class="cardhead">${emblem(n, d.affinity, 32)}<div><span class="stars">${'★'.repeat(u.rarity)}</span> <span class="tiername">${M.RARITY_NAMES[u.rarity]}</span><br><span class="cname">${n}</span>${o.copies > 1 ? ` <span style="font-size:9px;color:var(--dim)">+${o.copies - 1}</span>` : ''}</div></div>
      <div class="epithet">“${lore.epithet || ''}”</div>

      ${hasKinship ? `<div class="kinship">✦ Kinship Protocol: +${Math.round(M.KINSHIP.atk * 100)}% ATK/DEF in battle</div>` : ''}
      <details><summary>DOSSIER</summary><p>${lore.bio || ''}</p></details>

    </div>`;
  }).join('');

  const unownedFives = M.FIVE_STAR_NAMES.filter((n) => !profile.owned[n]);
  const shop = `<div class="shop"><h3>Echo Exchange — dupes are never wasted</h3><div class="row">` +
    (unownedFives.length ? unownedFives.map((n) =>
      `<button class="shopbtn" data-buy="${n}" ${profile.shards >= M.SHARD_PRICE_5 ? '' : 'disabled'}>${n} — ◆${M.SHARD_PRICE_5}</button>`).join('')
      : '<span style="font-size:10px;color:var(--dim)">all standard 5★ operatives recruited!</span>') +
    `</div></div>`;

  const kinNote = bonded.length
    ? ` · <span class="kinship">Kinship active: ${bonded.map((f) => M.FACTIONS[f].label).join(', ')}</span>`
    : ' · field 2+ operatives of one House for Kinship (+12% ATK/DEF each)';
  $('hangar').innerHTML =
    `<p style="font-size:11px;color:var(--dim);text-align:center;margin-bottom:8px">Squad ${profile.squad.length}/5 — gear costs ▣1 to equip (refunded on unequip)${kinNote}</p>` +
    `<div class="row">${cards}</div>` + shop;

  for (const sel of $('hangar').querySelectorAll('select')) {
    sel.onchange = () => {
      if (!M.equipGear(profile, sel.dataset.n, sel.value || null)) sel.value = profile.owned[sel.dataset.n].gear || '';
      save(); renderHangar();
    };
  }
  for (const b of $('hangar').querySelectorAll('.sqbtn')) {
    b.onclick = () => {
      const n = b.dataset.n, i = profile.squad.indexOf(n);
      if (i >= 0) profile.squad.splice(i, 1);
      else if (profile.squad.length < 5) profile.squad.push(n);
      save(); renderHangar();
    };
  }
  for (const b of $('hangar').querySelectorAll('[data-buy]')) {
    b.onclick = () => { M.shardBuy(profile, b.dataset.buy); save(); renderHangar(); };
  }
  for (const b of $('hangar').querySelectorAll('[data-lvl]')) {
    b.onclick = () => { M.levelUp(profile, b.dataset.lvl); save(); renderHangar(); };
  }
}

// ------------------------------------------------------------ battle

let bstate = null, currentEnc = null, currentActor = null, pendingSkill = null, auto = false, fast = false;

// ---- story playback ----
let storyLines = null, storyIdx = 0, storyDone = null;

function speakerColor(who) {
  if (who === 'NAVIGATOR') return 'var(--gold)';
  if (who === 'MERIDIAN') return 'var(--accent)';
  const lore = M.LORE[who];
  if (lore && M.FACTIONS[lore.faction]) return M.FACTIONS[lore.faction].color;
  return 'var(--debuff)'; // unknown voices (SABLE-OF-NINE...) read as a threat
}

function playStory(lines, done) {
  if (!lines || !lines.length) { done(); return; }
  storyLines = lines; storyIdx = 0; storyDone = done;
  renderStoryLine();
  show('storyModal');
}

function renderStoryLine() {
  const l = storyLines[storyIdx];
  $('storySpeaker').textContent = l.who;
  $('storySpeaker').style.color = speakerColor(l.who);
  $('storyText').textContent = l.text;
  $('storyNext').textContent = storyIdx < storyLines.length - 1 ? '▸ click to continue' : '▸ click to finish';
}

function advanceStory() {
  if (++storyIdx < storyLines.length) renderStoryLine();
  else finishStory();
}

function finishStory() {
  hide('storyModal');
  const done = storyDone;
  storyLines = null; storyDone = null;
  if (done) done();
}

$('storyBox').onclick = advanceStory;
$('storySkip').onclick = finishStory;

// ---- battle flow ----

function startBattle(encId) {
  currentEnc = M.encounterById(encId);
  const firstTime = !profile.cleared[encId];
  const begin = () => {
    bstate = S.newBattle(undefined, M.squadDefs(profile), currentEnc.foes);
    const bonded = M.kinshipFactions(profile.squad.filter((n) => profile.owned[n]).slice(0, 5));
    for (const f of bonded) {
      bstate.log.push({ text: `Kinship Protocol: ${M.FACTIONS[f].label} operatives fight side by side (+12% ATK/DEF)`, cls: 'buff', turn: 0 });
    }
    currentActor = null; pendingSkill = null;
    switchScreen('battle');
    render();
    loop();
  };
  const story = M.STORY[encId];
  if (firstTime && story) playStory(story.intro, begin);
  else begin();
}

// ---- RAID-style presentation layer ----

const AFF_HEX = { ion: '#7dd3fc', cryo: '#a5b4fc', plasma: '#fda4af', umbral: '#c084fc' };

function initials(name) {
  const words = name.replace(/[^A-Za-z0-9 -]/g, '').split(/[\s-]+/).filter(Boolean);
  return (words.length > 1 ? words[0][0] + words[1][0] : name.slice(0, 2)).toUpperCase();
}

// Procedural character emblem: affinity-colored hex crest with House ring + initials.
function emblem(name, affinity, size, massive) {
  const aff = AFF_HEX[affinity] || '#888';
  const lore = M.LORE[name];
  const ring = lore && M.FACTIONS[lore.faction] ? M.FACTIONS[lore.faction].color : (massive ? '#f472b6' : '#2a3352');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${aff}"/><stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient></defs>
    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="url(#g)" stroke="${ring}" stroke-width="2.5"/>
    ${massive ? `<polygon points="20,6 33,13 33,27 20,34 7,27 7,13" fill="none" stroke="#f472b6" stroke-width="1" opacity=".7"/>` : ''}
    <text x="20" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0a0e1a">${initials(name)}</text>
  </svg>`;
  return `<img class="emblem" width="${size}" height="${size}" alt="" src="data:image/svg+xml,${encodeURIComponent(svg)}">`;
}

// Floating damage numbers / flashes / cast pulses, driven by the engine's event stream.
let eventCursor = 0;

function cardRect(id) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  return el ? el.getBoundingClientRect() : null;
}

function spawnFx(html, rect, cls) {
  const fx = document.createElement('div');
  fx.className = cls;
  fx.innerHTML = html;
  $('fxlayer').appendChild(fx);
  fx.style.left = rect.left + rect.width / 2 - fx.offsetWidth / 2 + (Math.random() * 24 - 12) + 'px';
  fx.style.top = rect.top + rect.height * 0.3 + 'px';
  setTimeout(() => fx.remove(), 950);
}

function processEvents() {
  if (!bstate) return;
  if (eventCursor > bstate.events.length) eventCursor = 0; // new battle started
  const fresh = bstate.events.slice(eventCursor);
  eventCursor = bstate.events.length;
  if (view3d && fresh.length) Battle3D.events(fresh);
  for (const e of fresh) {
    const rect = cardRect(e.target || e.unit);
    if (!rect) continue;
    if (e.type === 'hit') {
      const cls = e.crit ? 'crit' : e.weak ? 'weak' : 'norm';
      spawnFx(`-${e.amount}${e.crit ? '!' : ''}`, rect, `dmgnum ${cls}`);
      const flash = document.createElement('div');
      flash.className = 'hitflash' + (e.crit ? ' critf' : '');
      Object.assign(flash.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px' });
      $('fxlayer').appendChild(flash);
      setTimeout(() => flash.remove(), 400);
      if (e.crit || e.amount > 3000) {
        const bf = $('battlefield');
        bf.classList.remove('shake'); void bf.offsetWidth; bf.classList.add('shake');
      }
    } else if (e.type === 'heal') {
      spawnFx(`+${e.amount}`, rect, 'dmgnum heal');
    } else if (e.type === 'cast' && e.big) {
      const ring = document.createElement('div');
      ring.className = 'castring';
      Object.assign(ring.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px' });
      $('fxlayer').appendChild(ring);
      setTimeout(() => ring.remove(), 550);
      const caster = bstate.units.find((u) => u.id === e.unit);
      if (caster) showCutin(caster, e.skill);
    } else if (e.type === 'rebirth') {
      spawnFx('REBORN', rect, 'dmgnum crit');
    }
  }
}

// Skill cut-in banner: portrait sweeps in, skill name flashes (RAID/HSR ultimate feel).
let cutinCooldown = 0;
function showCutin(caster, skillName) {
  const now = Date.now();
  if (now < cutinCooldown) return;       // avoid stacking banners
  cutinCooldown = now + (fast ? 500 : 950);
  const el = $('cutin');
  const affHex = AFF_HEX[caster.affinity] || '#888';
  el.querySelector('.portrait').innerHTML = emblem(caster.name, caster.affinity, 56, caster.massive);
  el.querySelector('.who').textContent = caster.name;
  const skill = el.querySelector('.skill');
  skill.textContent = skillName;
  skill.style.color = affHex;
  el.querySelector('.band').style.borderColor = affHex;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), fast ? 500 : 950);
}

// Pull cinematic: warp core → rarity crack → reveal. Skippable. Then hands off to the reveal grid.
function playCinematic(results, done) {
  const cin = $('cinema');
  const core = $('cinemaCore');
  const result = $('cinemaResult');
  // Highest rarity in the batch drives the finale color.
  const best = results.reduce((m, r) => Math.max(m, r.rarity), 3);
  cin.classList.add('show');
  result.classList.remove('show');
  result.innerHTML = '';
  core.style.display = 'block';
  core.style.animation = 'none'; void core.offsetWidth;
  core.style.animation = 'warp 1.6s ease-in forwards';

  // Warp-speed starfield: streaks accelerating out from the core.
  const cv = $('cinemaStars');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const cx = cv.width / 2, cy = cv.height / 2;
  const stars = Array.from({ length: 160 }, () => ({ a: Math.random() * Math.PI * 2, r: Math.random() * 40, sp: 1 + Math.random() * 3 }));
  const tierHex = best === 5 ? '#ffd75e' : best === 4 ? '#c084fc' : '#7dd3fc';
  let warping = true;
  (function warpDraw() {
    if (!cin.classList.contains('show')) { warping = false; return; }
    ctx.fillStyle = 'rgba(4,6,14,0.35)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      const x1 = cx + Math.cos(s.a) * s.r, y1 = cy + Math.sin(s.a) * s.r;
      s.r += s.sp * (warping ? 1.6 : 0.4); s.sp *= 1.015;
      const x2 = cx + Math.cos(s.a) * s.r, y2 = cy + Math.sin(s.a) * s.r;
      ctx.strokeStyle = warping ? tierHex : '#aabbee';
      ctx.globalAlpha = Math.min(1, s.r / 200);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      if (s.r > Math.max(cv.width, cv.height)) { s.r = 0; s.sp = 1 + Math.random() * 3; }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(warpDraw);
  })();

  let skipped = false;
  const finish = () => {
    if (skipped) return; skipped = true;
    cin.classList.remove('show');
    cin.onclick = null;
    done();
  };
  const reveal = () => {
    if (skipped) return;
    core.style.display = 'none';
    // Show the highest-rarity headline card; the full 10-pull grid follows in the modal.
    const head = results.slice().sort((a, b) => b.rarity - a.rarity)[0];
    const lore = M.LORE[head.name];
    const unitDef = M.UNITS[head.name];
    result.innerHTML =
      `<div class="rtier r${head.rarity}">${M.RARITY_NAMES[head.rarity]} SIGNAL LOCKED</div>` +
      (unitDef ? `<div>${emblem(head.name, unitDef.def.affinity, 96, false)}</div>` : '') +
      `<div class="rname">${head.name}</div>` +
      (lore ? `<div class="rep">“${lore.epithet}”</div>` : '') +
      `<div style="font-size:11px;color:var(--dim);margin-top:8px">click to see all ${results.length} ▸</div>`;
    result.classList.add('show');
    cin.onclick = finish;
  };
  cin.onclick = () => { // click during warp = skip straight to reveal; click during reveal = finish
    if (result.classList.contains('show')) finish();
    else { core.style.display = 'none'; reveal(); }
  };
  clearTimeout(cin._t1); clearTimeout(cin._t2);
  cin._t1 = setTimeout(reveal, 1650);
  cin._t2 = setTimeout(() => { if (!skipped && result.classList.contains('show')) finish(); }, 4200);
}

// Turn-order forecast ribbon (the RAID signature strip).
function renderRibbon() {
  const living = bstate.units.filter((u) => u.alive);
  const order = living
    .map((u) => ({ u, eta: (S.METER_MAX - u.meter) / Math.max(1, S.effStat(u, 'spd')) }))
    .sort((a, b) => a.eta - b.eta)
    .slice(0, 8);
  $('turnRibbon').innerHTML = '<span class="rlabel">Next ▸</span>' + order.map(({ u }, i) =>
    `<span class="ribchip ${u.side} ${i === 0 ? 'first' : ''}" title="${u.name}" style="background:${AFF_HEX[u.affinity] || '#888'}">${initials(u.name)}</span>`
  ).join('');
}

function fxChips(u) {
  return u.effects.map((e) => {
    const m = S.EFFECTS[e.type];
    return `<span class="chip ${m.kind}">${m.label} ${e.turns}</span>`;
  }).join('');
}

function card(u) {
  const hpPct = (100 * u.hp / u.maxHp).toFixed(1);
  const shPct = Math.min(100, 100 * u.shield / u.maxHp).toFixed(1);
  const mPct = (100 * u.meter / S.METER_MAX).toFixed(1);
  const classes = ['card'];
  if (u.massive) classes.push('titanunit');
  if (!u.alive) classes.push('dead');
  if (currentActor && u.id === currentActor.id) classes.push('active');
  if (pendingSkill !== null && u.alive && targetableSide() === u.side) classes.push('targetable');
  const phaseNote = u.phases && u.phases.length
    ? ` · phases ${u.phases.filter((p) => p.done).length}/${u.phases.length}` : '';
  const rebirthNote = u.rebirth ? (u.rebirthUsed ? ' · reborn' : ' · WILL BE REBORN') : '';
  return `<div class="${classes.join(' ')}" data-id="${u.id}">
    <div class="cardhead">${emblem(u.name, u.affinity, u.massive ? 40 : 26, u.massive)}<div class="cname">${u.name}</div></div>
    <div class="tagline"><span class="aff ${u.affinity}">${u.affinity}</span> ${u.role}${u.enrage && u.enrageStacks ? ` · enrage +${Math.round(u.enrage * u.enrageStacks * 100)}%` : ''}${phaseNote}${rebirthNote}</div>
    <div class="bar"><i class="hpfill ${u.hp / u.maxHp < 0.35 ? 'low' : ''}" style="width:${hpPct}%"></i></div>
    ${u.shield > 0 ? `<div class="bar"><i class="shieldfill" style="width:${shPct}%"></i></div>` : ''}
    <div class="bar"><i class="meterfill" style="width:${mPct}%"></i></div>
    <div class="nums"><span>${u.hp}/${u.maxHp}</span><span>SPD ${Math.round(S.effStat(u, 'spd'))}</span></div>
    <div class="fx">${fxChips(u)}</div>
  </div>`;
}

function targetableSide() {
  if (!currentActor || pendingSkill === null) return null;
  const s = currentActor.skills[pendingSkill];
  return (s.target === 'ally' || s.target === 'allAllies' || s.target === 'self') ? 'hero' : 'foe';
}

function render() {
  if (!bstate) return;
  $('foeRow').innerHTML = bstate.units.filter((u) => u.side === 'foe').map(card).join('');
  $('heroRow').innerHTML = bstate.units.filter((u) => u.side === 'hero').map(card).join('');
  for (const el of document.querySelectorAll('.card.targetable')) el.onclick = () => pickTarget(el.dataset.id);
  renderRibbon();
  renderSkills();
  renderLog();
  processEvents();
  if (view3d) Battle3D.sync(bstate, currentActor && currentActor.id);
}

function renderSkills() {
  const box = $('skills');
  if (!currentActor || currentActor.side !== 'hero' || auto || bstate.winner) {
    box.innerHTML = `<span style="font-size:11px;color:var(--dim)">${bstate.winner ? 'battle over' : auto ? 'auto-battle engaged' : 'enemy acting...'}</span>`;
    return;
  }
  box.innerHTML = currentActor.skills.map((s, i) => {
    const cd = currentActor.cooldowns[i];
    const parts = [];
    if (s.mult) parts.push(`${s.mult}× dmg`);
    if (s.healPct) parts.push(`heal ${Math.round(s.healPct * 100)}%`);
    if (s.cleanse) parts.push('cleanse');
    if (s.tmBoostAllies) parts.push('TM boost');
    if (s.tmDrain) parts.push('TM drain');
    for (const e of s.effects || []) parts.push(S.EFFECTS[e.type].label);
    return `<button class="skillbtn" data-i="${i}" ${cd > 0 ? 'disabled' : ''}>${s.name}${cd > 0 ? ` (${cd})` : ''}<small>${parts.join(' · ') || 'attack'}${s.cd ? ` · ${s.cd}t cd` : ''}</small></button>`;
  }).join('');
  for (const b of box.querySelectorAll('button:not(:disabled)')) b.onclick = () => selectSkill(+b.dataset.i);
}

function renderLog() {
  const box = $('logbox');
  box.innerHTML = bstate.log.slice(-80).map((l) => `<div class="${l.cls}">${l.text}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

function selectSkill(i) {
  const s = currentActor.skills[i];
  if (s.target === 'allEnemies' || s.target === 'allAllies' || s.target === 'self') act(i, null);
  else {
    pendingSkill = i;
    $('hint').textContent = `${s.name}: choose a ${s.target === 'ally' ? 'ally' : 'target'} ▸`;
    render();
  }
}

function pickTarget(id) {
  const t = bstate.units.find((u) => u.id === id);
  const i = pendingSkill;
  pendingSkill = null;
  $('hint').textContent = '';
  act(i, t);
}

function act(skillIdx, target) {
  S.executeTurn(bstate, currentActor, skillIdx, target);
  bstate.winner = S.battleOver(bstate);
  currentActor = null;
  render();
  setTimeout(loop, fast ? 220 : 550);
}

function loop() {
  if (!bstate || bstate.winner) return endBattle();
  currentActor = S.nextActor(bstate);
  render();
  if (currentActor.side === 'foe' || auto) {
    const { skillIdx, target } = S.chooseAction(bstate, currentActor);
    setTimeout(() => { if (bstate && currentActor) act(skillIdx, target); }, fast ? 200 : 500);
  }
}

let pendingOutro = null;

function endBattle() {
  if (!bstate || !bstate.winner) return;
  render();
  if (frontier) {
    if (bstate.winner === 'hero') {
      for (const u of bstate.units) {
        if (u.side === 'hero') frontier.hpFrac[u.name] = u.alive ? u.hp / u.maxHp : 0.05;
      }
      const r = M.frontierStageReward(profile, frontier.stage);
      const last = frontier.stage >= M.FRONTIER.stages.length - 1;
      let bonusHtml = '';
      if (last) {
        const b = M.claimReward(profile, M.FRONTIER.seasonKey, M.FRONTIER.clearBonus, { voidglass: 0 });
        if (b.first) bonusHtml = `<br>SEASONAL JACKPOT: +⬡${b.voidglass} +▣${b.caches}`;
      }
      save();
      $('endTitle').textContent = last ? 'Frontier Held' : `${M.FRONTIER.stages[frontier.stage].name} Held`;
      $('endTitle').style.color = 'var(--gold)';
      $('endRewards').innerHTML = `+⬡${r.voidglass} +¢${r.credits}${r.caches ? ` +▣${r.caches}` : ''}${bonusHtml}${last ? '' : '<br>The next line is forming.'}`;
    } else {
      $('endTitle').textContent = 'Line Broken';
      $('endTitle').style.color = 'var(--hp-low)';
      $('endRewards').innerHTML = 'Stages already held stay paid. The protocol rotates weekly — some weeks favor your squad.';
    }
    show('endModal');
    return;
  }
  if (rift) {
    if (bstate.winner === 'hero') {
      for (const u of bstate.units) {
        if (u.side === 'hero') rift.hpFrac[u.name] = u.alive ? u.hp / u.maxHp : 0.05;
      }
      const r = M.riftReward(profile, rift.depth);
      save();
      const last = rift.depth >= M.RIFT.depths.length - 1;
      $('endTitle').textContent = last ? 'Rift Conquered' : `Depth ${rift.depth + 1} Cleared`;
      $('endTitle').style.color = 'var(--gold)';
      $('endRewards').innerHTML = `+⬡${r.voidglass} &nbsp; +¢${r.credits}${r.caches ? ` &nbsp; +▣${r.caches}` : ''}${last ? '<br>Full clear — the rift reseals until it stirs again.' : '<br>Choose a blessing and descend.'}`;
    } else {
      $('endTitle').textContent = 'Run Collapsed';
      $('endTitle').style.color = 'var(--hp-low)';
      $('endRewards').innerHTML = `The rift keeps nothing you earned — depths already cleared stay paid. Deeper next time.`;
    }
    show('endModal');
    return;
  }
  if (currentMode) {
    if (bstate.winner === 'hero') {
      let r;
      if (currentMode.type === 'titan') {
        const t = M.titanById(currentMode.id);
        r = M.claimReward(profile, 'titan:' + t.id, t.firstClear, t.repeat);
        const gearKey = M.unlockTitanGear(profile, t.id);
        if (gearKey) r.gearHtml = `<br>☠ TITAN-FORGED GEAR UNLOCKED: ${M.GEAR_SETS[gearKey].label.toUpperCase()}`;
        $('endTitle').textContent = r.first ? 'TITAN SLAIN' : 'Echo Dispersed';
      } else {
        r = M.claimReward(profile, 'vault:' + currentMode.id, M.VAULT_REWARD_FIRST, M.VAULT_REWARD_REPEAT);
        $('endTitle').textContent = 'Vault Secured';
      }
      save();
      $('endTitle').style.color = 'var(--gold)';
      $('endRewards').innerHTML = `${r.first ? 'FIRST CLEAR JACKPOT<br>' : ''}${r.voidglass ? `+⬡${r.voidglass} ` : ''}${r.credits ? ` +¢${r.credits}` : ''}${r.caches ? ` +▣${r.caches}` : ''}${r.shards ? ` +◆${r.shards}` : ''}${r.gearHtml || ''}`;
    } else {
      $('endTitle').textContent = currentMode.type === 'titan' ? 'The Titan Prevails' : 'Vault Overrun';
      $('endTitle').style.color = 'var(--hp-low)';
      $('endRewards').innerHTML = currentMode.type === 'titan'
        ? 'Titans punish attrition — bring damage, Heal Blackout, and answers to their mechanic.'
        : 'Recruit and level more of this House — collection depth is the key that opens vaults.';
    }
    show('endModal');
    return;
  }
  if (bstate.winner === 'hero') {
    const firstTime = !profile.cleared[currentEnc.id];
    const story = M.STORY[currentEnc.id];
    if (firstTime && story) pendingOutro = story.outro;
    const r = M.applyVictory(profile, currentEnc.id);
    save();
    $('endTitle').textContent = 'Victory';
    $('endTitle').style.color = 'var(--gold)';
    $('endRewards').innerHTML = `${r.first ? 'FIRST CLEAR JACKPOT<br>' : ''}+⬡${r.voidglass}${r.credits ? ` &nbsp; +¢${r.credits}` : ''}${r.caches ? ` &nbsp; +▣${r.caches}` : ''}`;
  } else {
    $('endTitle').textContent = 'Squad Lost';
    $('endTitle').style.color = 'var(--hp-low)';
    $('endRewards').innerHTML = 'No penalty — regear, reroll the squad, counter the affinity, and try again.';
  }
  show('endModal');
}

function closeBattle() {
  hide('endModal');
  if (frontier) {
    const won = bstate && bstate.winner === 'hero';
    const last = frontier.stage >= M.FRONTIER.stages.length - 1;
    bstate = null; currentActor = null;
    if (won && !last) { frontier.stage++; startFrontierBattle(); return; }
    frontier = null;
    switchScreen('frontier');
    return;
  }
  if (currentMode) {
    const tab = currentMode.returnTab;
    currentMode = null; bstate = null; currentActor = null;
    switchScreen(tab);
    return;
  }
  if (rift) {
    const won = bstate && bstate.winner === 'hero';
    const last = rift.depth >= M.RIFT.depths.length - 1;
    bstate = null; currentActor = null;
    if (won && !last) { offerBlessings(); return; }
    rift = null;
    switchScreen('rift');
    return;
  }
  bstate = null; currentEnc = null; currentActor = null;
  const outro = pendingOutro;
  pendingOutro = null;
  if (outro) playStory(outro, () => switchScreen('missions'));
  else switchScreen('missions');
}

let view3d = false;
$('threeBtn').onclick = () => {
  if (!view3d) {
    if (!Battle3D.supported() || !Battle3D.init($('arena3d'))) {
      $('threeBtn').textContent = '3D N/A';
      return;
    }
    view3d = true;
    document.body.classList.add('view3d');
    $('threeBtn').classList.add('on');
    Battle3D.clear();
    if (bstate) Battle3D.sync(bstate, currentActor && currentActor.id);
    Battle3D.start();
  } else {
    view3d = false;
    document.body.classList.remove('view3d');
    $('threeBtn').classList.remove('on');
    Battle3D.stop();
  }
};

$('autoBtn').onclick = () => {
  auto = !auto;
  $('autoBtn').classList.toggle('on', auto);
  if (auto && bstate && currentActor && currentActor.side === 'hero' && !bstate.winner) {
    const { skillIdx, target } = S.chooseAction(bstate, currentActor);
    act(skillIdx, target);
  } else render();
};
$('fastBtn').onclick = () => { fast = !fast; $('fastBtn').classList.toggle('on', fast); };
$('fleeBtn').onclick = () => { bstate = null; rift = null; frontier = null; currentMode = null; currentEnc = null; currentActor = null; hide('endModal'); switchScreen('missions'); };

// ------------------------------------------------------------ character showcase

let showcaseReady = false, showcaseIdx = 0;

function paintShowcase(meta) {
  if (!meta) return;
  $('hsTier').innerHTML = '★'.repeat(meta.rarity) + ' &nbsp;' + meta.tier;
  const aff = $('hsAff'); aff.textContent = meta.aff; aff.className = 'aff ' + meta.affClass;
  $('hsRole').textContent = meta.role;
  $('hsHouse').textContent = meta.house;
  $('hsName').textContent = meta.name;
  $('hsEpithet').textContent = meta.epithet;
  $('hsBio').textContent = meta.bio;
  $('hsStats').innerHTML = Object.entries(meta.stats).map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('');
  $('hsNote').textContent = meta.note;
  const keys = Showcase.list();
  $('heroDots').innerHTML = keys.map((k, i) => `<span class="dot ${i === showcaseIdx ? 'on' : ''}" data-i="${i}"></span>`).join('');
  for (const d of $('heroDots').querySelectorAll('.dot')) d.onclick = () => selectShowcase(+d.dataset.i);
}

function selectShowcase(i) {
  const keys = Showcase.list();
  showcaseIdx = (i + keys.length) % keys.length;
  const meta = Showcase.select(keys[showcaseIdx]);
  paintShowcase(meta);
}

function openShowcase() {
  if (!Showcase.supported()) { $('hero3d').style.display = 'none'; paintShowcase(Showcase.meta('kaelis')); return; }
  if (!showcaseReady) showcaseReady = Showcase.init($('hero3d'));
  if (showcaseReady) { Showcase.start(); selectShowcase(showcaseIdx); }
}
$('heroPrev').onclick = () => selectShowcase(showcaseIdx - 1);
$('heroNext').onclick = () => selectShowcase(showcaseIdx + 1);
$('heroRecruit').onclick = () => switchScreen('gacha');

// ------------------------------------------------------------ boot

renderCurrencies();
renderMissions();
</script>
</body>
</html>
